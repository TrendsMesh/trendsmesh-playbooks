# The engine tests' settings. The tests live here, outside the plugin folder, so the plugin ships without
# them (Anthropic's plugin directory counts every file in the plugin folder, issue #108).
[pytest]
pythonpath = ../plugins/trendsmesh-playbooks/engine/src
markers =
    tools: needs the heavy tool dependencies (pixi run -e dev-full test-tools)
    video: renders with Remotion, needs Node and a browser download (pixi run -e dev-full test-video)
    private_data: needs handoff/ or the fixtures made from it; skipped in the public copy (tests/engine/private.py)
    free_choice: the real Free/Paid choice (issue #106), not the tests' default that the user chose Free

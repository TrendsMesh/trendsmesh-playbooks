schema_version: "1.1"
name: ra_e1_overlap
# Was ra_e1_plan_original_overlaps (renamed in issue 76: every path in the repo stays within 90 characters).
context:
  scaffold_script: fixture.sh
---
description: "Check-every-step run at E1 (test design), the 15 s re-cut accepted. Both test ads are new (issue #64, option 1): the live test plan says the original ad keeps running, untouched, in its own campaign, that it reaches the same people as the test and may slow the test's delivery, and what happens if the variant wins (a PAUSED ad set in the original's campaign, with the user's yes). Nothing is spent or paused."
tags: [live-test]
max_turns: 40
timeout_seconds: 1200
allowed_tools: [Read, Glob, Grep, Write, Skill]
append_system_prompt: |
  Test harness notes, not from the user. If you are following the refresh-ad playbook: the
  engine command `tm` is not on PATH in this sandbox, so wherever the playbook says `tm ...`, run
  `sh ./tm.sh ...` from the working directory instead (same arguments, add --json as usual); and
  the date today is 2026-11-05, so add `--today 2026-11-05` to `tm r1`. Write final answers for the
  user in plain words. This sandbox has no media files and no Meta connection: the video and music
  files in the run folder are placeholders, and the run already holds what the media tools made
  from the real files. Where the plan needs Meta's eligibility answer, say it is not checked here.

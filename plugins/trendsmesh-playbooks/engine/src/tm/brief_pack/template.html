<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="{{FONTS}}">
<style>
{{STYLE}}
</style>
</head>
<body>
<!--BODY-->
<script>
  // recipient views (CB13): one brief, a view per recipient ticked at intake
  const RECIPIENTS = {{RECIPIENTS}};
  const vbButtons = [...document.querySelectorAll('.vb-buttons button')];
  vbButtons.forEach(b => { if (!RECIPIENTS.includes(b.dataset.view)) b.remove(); });
  function showView(v) {
    if (!RECIPIENTS.includes(v)) v = RECIPIENTS[0];
    document.querySelectorAll('[data-v]').forEach(el => { el.hidden = !el.dataset.v.split(' ').includes(v); });
    document.querySelectorAll('.vb-buttons button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v));
    document.body.dataset.view = v;
  }
  document.querySelectorAll('.vb-buttons button').forEach(b => b.addEventListener('click', () => {
    if (location.hash !== '#' + b.dataset.view) location.hash = b.dataset.view; else showView(b.dataset.view);
  }));
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (RECIPIENTS.includes(h)) showView(h); });
  document.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); const t = document.getElementById(a.dataset.jump); if (t) t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }));
  showView(location.hash.slice(1));

  // format toggles
  document.querySelectorAll('.player').forEach(p => {
    const v = p.querySelector('video');
    p.querySelectorAll('.toggle button').forEach(b => b.addEventListener('click', () => {
      p.querySelectorAll('.toggle button').forEach(x => x.setAttribute('aria-pressed', x === b));
      v.src = b.dataset.src; v.play().catch(() => {});
    }));
  });

  // decisions: saved to the artifact's shared database when the page runs on claude.ai
  const CS = {{CONCEPT_IDS}};
  const LABEL = { approve: 'Approved', change: 'Changes requested' };
  const mine = Object.fromEntries(CS.map(c => [c, {}]));
  let db = null, user = null, myId = null, writable = true, docs = [], saving = false, loaded = false, hydrated = false;
  const $ = (q, el = document) => el.querySelector(q);
  const boxes = Object.fromEntries(CS.map(c => [c, $(`.decide[data-concept="${c}"]`)]));
  function setMode(t) { $('#mode').textContent = t; }
  function paint(c) {
    const b = boxes[c];
    b.querySelectorAll('.choice').forEach(x => x.setAttribute('aria-pressed', mine[c].d === x.dataset.d));
    $('textarea', b).value = mine[c].n || '';
  }
  CS.forEach(c => {
    const b = boxes[c];
    b.querySelectorAll('.choice').forEach(x => x.addEventListener('click', () => {
      mine[c].d = mine[c].d === x.dataset.d ? null : x.dataset.d; paint(c); $('.status', b).textContent = 'Not saved yet.';
    }));
    $('textarea', b).addEventListener('input', e => { mine[c].n = e.target.value; $('.status', b).textContent = 'Not saved yet.'; });
    $('.save', b).addEventListener('click', () => save(c));
  });
  async function save(c) {
    const st = $('.status', boxes[c]);
    if (!mine[c].d) { st.textContent = 'Choose Approve or Ask for changes first.'; return; }
    if (!db || !myId) { st.textContent = 'Kept on this page only. Open the page from its claude.ai link to save it for the team, or use "Copy my decisions".'; renderTally(); return; }
    if (!writable) { st.textContent = 'Your access is view-only. Ask the sender for Contributor access, or use "Copy my decisions".'; return; }
    if (saving) return;
    saving = true; boxes[c].querySelector('.save').disabled = true; st.textContent = 'Saving…';
    const body = { updatedAt: new Date().toISOString() };
    CS.forEach(k => { if (mine[k].d) body[k] = { d: mine[k].d, n: (mine[k].n || '').slice(0, 2000) }; });
    try { await db.doc('decisions/' + myId).set(body); st.textContent = 'Saved. Everyone with this link can see it.'; }
    catch (e) {
      if (e && e.code === 'invalid_argument') { writable = false; st.textContent = 'Your access is view-only. Ask the sender for Contributor access, or use "Copy my decisions".'; }
      else st.textContent = 'Not saved: the connection failed. Try again in a moment.';
    } finally { saving = false; boxes[c].querySelector('.save').disabled = false; }
  }
  async function names(ids) {
    if (!user || !user.profiles || !ids.length) return {};
    try { return await user.profiles(ids) || {}; } catch { return {}; }
  }
  async function renderTally() {
    const list = docs.slice();
    if (!db) list.push({ id: 'me', ...Object.fromEntries(CS.filter(c => mine[c].d).map(c => [c, mine[c]])) });
    const ps = await names(list.map(d => d.id).filter(id => id !== 'me' && id !== myId));
    const who = d => (d.id === myId || d.id === 'me') ? 'You' : ((ps[d.id] && ps[d.id].name) || 'Someone');
    $('#tally').innerHTML = '';
    CS.forEach(c => {
      const rows = list.filter(d => d[c] && d[c].d);
      const a = rows.filter(d => d[c].d === 'approve').length, ch = rows.length - a;
      const li = document.createElement('li');
      li.textContent = rows.length ? `${c}: ${a} approved, ${ch} changes requested` : `${c}: none yet`;
      $('#tally').appendChild(li);
      const o = $('.others', boxes[c]); o.textContent = '';
      if (rows.length) {
        const p = document.createElement('div'); p.textContent = 'Decisions on this concept:'; o.appendChild(p);
        const ul = document.createElement('ul');
        rows.forEach(d => { const it = document.createElement('li'); it.textContent = `${who(d)}: ${LABEL[d[c].d] || d[c].d}${d[c].n ? ' (' + d[c].n + ')' : ''}`; ul.appendChild(it); });
        o.appendChild(ul);
      }
    });
  }
  $('#copy').addEventListener('click', async () => {
    const lines = ['Decisions on "{{TITLE_JS}}"'];
    CS.forEach(c => lines.push(`${c}: ${mine[c].d ? LABEL[mine[c].d] : 'no decision'}${mine[c].n ? ' | ' + mine[c].n : ''}`));
    const text = lines.join('\n'); const box = $('#copybox');
    try { await navigator.clipboard.writeText(text); setMode('Copied. Paste it wherever you send feedback.'); box.hidden = true; }
    catch { box.hidden = false; box.value = text; box.select(); setMode('Select the text below and copy it.'); }
  });
  (async () => {
    if (!window.claude || typeof window.claude.use !== 'function') { setMode('Decisions are kept on this page only. Open it from its claude.ai link to save them for the team.'); renderTally(); return; }
    const timer = setTimeout(() => { if (!loaded) setMode('Still connecting to shared decisions…'); }, 10000);
    try { db = await window.claude.use('db'); user = await window.claude.use('user'); } catch { db = null; }
    if (!db) { clearTimeout(timer); setMode('Shared decisions are unavailable here (sign in on claude.ai). Use "Copy my decisions".'); renderTally(); return; }
    try { myId = user ? await user.id() : null; } catch { myId = null; }
    if (!myId) { clearTimeout(timer); db = null; setMode('Sign in to save decisions for the team. Use "Copy my decisions" meanwhile.'); renderTally(); return; }
    try { if (user.can) { const w = await user.can('data.write'); if (w === false) writable = false; } } catch {}
    setMode(writable ? 'Decisions you save are shared with everyone who has this link.' : 'You can read decisions; your access does not allow saving.');
    db.collection('decisions').onSnapshot(snap => {
      if (!snap.metadata.fromCache) { loaded = true; clearTimeout(timer); }
      docs = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
      const me = docs.find(d => d.id === myId);
      if (me && !hydrated) { hydrated = true; CS.forEach(c => { if (me[c]) { mine[c] = { d: me[c].d, n: me[c].n || '' }; paint(c); } }); }
      renderTally();
    }, () => { clearTimeout(timer); setMode('Shared decisions could not be loaded. Use "Copy my decisions".'); });
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#121a2e; --night-2:#1c2741; --moon:#dfe5f1;
    --paper:#eef1f6; --sheet:#ffffff; --ink:#1b2333; --muted:#5b6478; --rule:#d5dbe6;
    --note:#f2c94c; --note-ink:#3b3112; --alarm:#e2553d; --ok:#2f7d5b;
    --hand:"Caveat", "Segoe Print", cursive;
    --sans:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:17px;line-height:1.55}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--note);outline-offset:3px;border-radius:4px}

  /* night band */
  .night{background:radial-gradient(1200px 500px at 80% -10%, #2a3a63 0%, transparent 60%), var(--night);color:var(--moon);padding:48px 24px 56px}
  .wrap{max-width:1180px;margin:0 auto}
  .night h1{font-size:clamp(30px,4.2vw,48px);line-height:1.08;font-weight:700;letter-spacing:-0.02em;margin:0 0 12px;max-width:22ch}
  .night .lede{color:#b9c3d8;max-width:62ch;margin:0 0 8px}
  .night .meta{color:#8f9ab3;font-size:15px;margin:0}
  .phones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:40px}
  .phone{display:flex;flex-direction:column;align-items:center;text-decoration:none}
  .phone .frame{width:min(100%,250px);aspect-ratio:9/16;border-radius:30px;background:#05070c;padding:9px;box-shadow:0 0 0 2px #2b3754, 0 30px 60px -20px rgba(0,0,0,.7)}
  .phone video{width:100%;height:100%;object-fit:cover;border-radius:22px;display:block;background:#000}
  .phone .note{margin-top:-18px;position:relative;background:var(--note);color:var(--note-ink);font-family:var(--hand);font-size:24px;line-height:1.05;padding:10px 14px 12px;width:min(92%,240px);transform:rotate(-2deg);box-shadow:0 8px 16px -8px rgba(0,0,0,.6)}
  .phone:nth-child(2) .note{transform:rotate(1.5deg)}
  .phone:nth-child(3) .note{transform:rotate(-1deg)}
  .phone .who{margin-top:14px;font-size:15px;color:#b9c3d8;text-align:center;max-width:30ch}
  .phone:hover .note{filter:brightness(1.05)}

  /* page */
  .page{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:48px;padding:48px 24px 80px}
  main{min-width:0}
  aside{position:sticky;top:20px;align-self:start;font-size:15px}
  aside nav a{display:block;padding:6px 0;text-decoration:none;color:var(--muted)}
  aside nav a:hover{color:var(--ink)}
  .decisions{margin-top:24px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px}
  .decisions h3{margin:0 0 6px;font-size:16px}
  .decisions p{margin:0 0 12px;color:var(--muted)}

  section{margin-bottom:56px}
  h2{font-size:28px;line-height:1.2;letter-spacing:-0.01em;margin:0 0 14px}
  h3{font-size:19px;margin:28px 0 10px}
  p{margin:0 0 14px;max-width:72ch}
  .findings{display:grid;gap:14px;margin:0;padding:0;list-style:none}
  .findings li{background:var(--sheet);border-left:4px solid var(--night-2);padding:14px 18px;border-radius:0 8px 8px 0;max-width:80ch}
  .findings strong{display:block;margin-bottom:2px}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:12px}
  .fact{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
  .fact b{font-size:22px;display:block}
  .fact span{color:var(--muted);font-size:15px}
  .src{color:var(--muted);font-size:14px}

  /* concept */
  .concept{scroll-margin-top:70px;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:32px;scroll-margin-top:20px}
  .concept header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start}
  .concept .tag{font-weight:700;color:var(--muted);font-size:15px;margin:0 0 4px}
  .concept h2{margin-bottom:8px}
  .hyp{background:#f6f8fb;border-radius:8px;padding:12px 14px;max-width:72ch}
  .player{width:220px}
  .player video{width:100%;border-radius:14px;background:#000;display:block}
  .toggle{display:flex;gap:6px;margin-top:8px}
  .toggle button{flex:1;font:inherit;font-size:14px;padding:6px;border-radius:6px;border:1px solid var(--rule);background:#fff;cursor:pointer}
  .toggle button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .hookline{font-family:var(--hand);font-size:30px;line-height:1.1;background:var(--note);color:var(--note-ink);display:inline-block;padding:8px 14px;transform:rotate(-1deg);margin:6px 0 10px}
  table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
  th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--rule)}
  th{font-weight:600;color:var(--muted);white-space:nowrap}
  td.t{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
  td .ost{font-weight:600}
  .table-scroll{overflow-x:auto}
  blockquote{margin:10px 0;padding:10px 16px;border-left:3px solid var(--note);background:#fffbea;max-width:72ch}
  blockquote cite{display:block;font-style:normal;color:var(--muted);font-size:14px;margin-top:4px}
  .evidence{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .evidence a{text-decoration:none;font-size:14px;color:var(--muted)}
  .evidence img{width:100%;aspect-ratio:9/12;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px;background:#ddd}
  .evidence b{color:var(--ink)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .copy{background:#f6f8fb;border-radius:8px;padding:14px 16px}
  .copy dt{font-weight:600;font-size:14px;color:var(--muted);margin-top:8px}
  .copy dt:first-child{margin-top:0}
  .copy dd{margin:2px 0 0}
  ul.qa{list-style:none;padding:0;margin:0}
  ul.qa li{padding:4px 0}
  ul.qa label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
  .rule-box{border:1px solid var(--alarm);background:#fdf1ee;border-radius:8px;padding:12px 14px;max-width:72ch}
  footer{color:var(--muted);font-size:14px}
  .phone .trendline{margin-top:6px;font-size:14px;color:#8f9ab3;text-align:center;max-width:30ch}
  .glance{margin:18px 0 6px;border:1px solid var(--rule);border-radius:12px;overflow:hidden;max-width:80ch}
  .glance h3{margin:0;padding:10px 16px;font-size:16px;background:var(--night);color:var(--moon)}
  .glance dl{margin:0}
  .glance .g{display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;padding:12px 16px;border-top:1px solid var(--rule)}
  .glance .g:first-child{border-top:0}
  .glance dt{font-weight:700}
  .glance dd{margin:0}
  .glance .src{display:block;margin-top:2px}
  .glance .g.trend{background:#fffbea}
  .caveat{color:var(--muted);font-size:15px;max-width:80ch;margin-top:14px}
  .note-box{border:1px solid var(--rule);background:#f6f8fb;border-radius:8px;padding:12px 14px;max-width:72ch}
  .decide{margin-top:28px;padding:18px;border:2px solid var(--ink);border-radius:12px;display:grid;gap:10px;max-width:72ch}
  .decide h3{margin:0}
  .decide .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .choice,.save{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--ink);padding:9px 14px;cursor:pointer;background:#fff;color:var(--ink)}
  .save{background:var(--ink);color:#fff}
  .save:disabled{opacity:.5;cursor:default}
  .choice[aria-pressed="true"][data-d="approve"]{background:var(--ok);border-color:var(--ok);color:#fff}
  .choice[aria-pressed="true"][data-d="change"]{background:var(--alarm);border-color:var(--alarm);color:#fff}
  .decide textarea,.copybox{font:inherit;width:100%;min-height:70px;border:1px solid var(--rule);border-radius:8px;padding:10px}
  .status{color:var(--muted);font-size:15px}
  .others{font-size:15px;color:var(--muted)}
  .others ul{margin:4px 0 0;padding-left:18px}
  #tally{margin:0 0 10px;padding-left:18px}
  #mode{font-size:14px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (max-width:600px){.glance .g{grid-template-columns:1fr;gap:2px}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}

  @media (max-width:900px){
    .page{grid-template-columns:1fr}
    aside{position:static;order:-1}
    .phones{grid-template-columns:1fr;max-width:300px;margin-inline:auto}
    .concept{padding:22px}
    .concept header{grid-template-columns:1fr}
    .player{width:min(100%,260px)}
    .two{grid-template-columns:1fr}
    .evidence{grid-template-columns:repeat(3,minmax(0,1fr))}
  }

  .viewbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--rule);box-shadow:0 6px 18px -14px rgba(18,26,46,.5)}
  .viewbar-in{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 24px}
  .vb-label{font-weight:600;color:var(--muted)}
  .vb-buttons{display:flex;flex-wrap:wrap;gap:6px}
  .vb-buttons button{font:inherit;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--rule);background:#fff;color:var(--ink);cursor:pointer}
  .vb-buttons button[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:var(--moon)}
  .vb-hint{font-size:14px;color:var(--muted);margin-left:auto}
  .keymsg{font-size:18px;border-left:4px solid var(--note);padding:6px 0 6px 14px;max-width:72ch}
  .facts.small{margin:16px 0 4px}
  .facts.small .fact b{font-size:16px}
  .todo{color:var(--alarm);font-weight:600}
  .role{margin-top:24px;padding:20px;border-radius:12px;background:#f6f8fb}
  .role h3:first-child{margin-top:0}
  ul.plain{margin:6px 0 14px;padding-left:20px;max-width:72ch}
  .small-note{color:var(--muted);font-size:15px}
  [data-v][hidden]{display:none !important}
  @media (max-width:900px){.vb-hint{margin-left:0;width:100%}}
</style>
</head>
<body>
<!--BODY-->
<script>
  // recipient views (CB13): one brief, a view per recipient ticked at intake
  const RECIPIENTS = {{RECIPIENTS}};
  const vbButtons = [...document.querySelectorAll('.vb-buttons button')];
  vbButtons.forEach(b => { if (!RECIPIENTS.includes(b.dataset.view)) b.remove(); });
  function showView(v) {
    if (!RECIPIENTS.includes(v)) v = RECIPIENTS[0];
    document.querySelectorAll('[data-v]').forEach(el => { el.hidden = !el.dataset.v.split(' ').includes(v); });
    document.querySelectorAll('.vb-buttons button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v));
    document.body.dataset.view = v;
  }
  document.querySelectorAll('.vb-buttons button').forEach(b => b.addEventListener('click', () => {
    if (location.hash !== '#' + b.dataset.view) location.hash = b.dataset.view; else showView(b.dataset.view);
  }));
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (RECIPIENTS.includes(h)) showView(h); });
  document.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); const t = document.getElementById(a.dataset.jump); if (t) t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }));
  showView(location.hash.slice(1));

  // format toggles
  document.querySelectorAll('.player').forEach(p => {
    const v = p.querySelector('video');
    p.querySelectorAll('.toggle button').forEach(b => b.addEventListener('click', () => {
      p.querySelectorAll('.toggle button').forEach(x => x.setAttribute('aria-pressed', x === b));
      v.src = b.dataset.src; v.play().catch(() => {});
    }));
  });

  // decisions: saved to the artifact's shared database when the page runs on claude.ai
  const CS = {{CONCEPT_IDS}};
  const LABEL = { approve: 'Approved', change: 'Changes requested' };
  const mine = Object.fromEntries(CS.map(c => [c, {}]));
  let db = null, user = null, myId = null, writable = true, docs = [], saving = false, loaded = false, hydrated = false;
  const $ = (q, el = document) => el.querySelector(q);
  const boxes = Object.fromEntries(CS.map(c => [c, $(`.decide[data-concept="${c}"]`)]));
  function setMode(t) { $('#mode').textContent = t; }
  function paint(c) {
    const b = boxes[c];
    b.querySelectorAll('.choice').forEach(x => x.setAttribute('aria-pressed', mine[c].d === x.dataset.d));
    $('textarea', b).value = mine[c].n || '';
  }
  CS.forEach(c => {
    const b = boxes[c];
    b.querySelectorAll('.choice').forEach(x => x.addEventListener('click', () => {
      mine[c].d = mine[c].d === x.dataset.d ? null : x.dataset.d; paint(c); $('.status', b).textContent = 'Not saved yet.';
    }));
    $('textarea', b).addEventListener('input', e => { mine[c].n = e.target.value; $('.status', b).textContent = 'Not saved yet.'; });
    $('.save', b).addEventListener('click', () => save(c));
  });
  async function save(c) {
    const st = $('.status', boxes[c]);
    if (!mine[c].d) { st.textContent = 'Choose Approve or Ask for changes first.'; return; }
    if (!db || !myId) { st.textContent = 'Kept on this page only. Open the page from its claude.ai link to save it for the team, or use "Copy my decisions".'; renderTally(); return; }
    if (!writable) { st.textContent = 'Your access is view-only. Ask the sender for Contributor access, or use "Copy my decisions".'; return; }
    if (saving) return;
    saving = true; boxes[c].querySelector('.save').disabled = true; st.textContent = 'Saving…';
    const body = { updatedAt: new Date().toISOString() };
    CS.forEach(k => { if (mine[k].d) body[k] = { d: mine[k].d, n: (mine[k].n || '').slice(0, 2000) }; });
    try { await db.doc('decisions/' + myId).set(body); st.textContent = 'Saved. Everyone with this link can see it.'; }
    catch (e) {
      if (e && e.code === 'invalid_argument') { writable = false; st.textContent = 'Your access is view-only. Ask the sender for Contributor access, or use "Copy my decisions".'; }
      else st.textContent = 'Not saved: the connection failed. Try again in a moment.';
    } finally { saving = false; boxes[c].querySelector('.save').disabled = false; }
  }
  async function names(ids) {
    if (!user || !user.profiles || !ids.length) return {};
    try { return await user.profiles(ids) || {}; } catch { return {}; }
  }
  async function renderTally() {
    const list = docs.slice();
    if (!db) list.push({ id: 'me', ...Object.fromEntries(CS.filter(c => mine[c].d).map(c => [c, mine[c]])) });
    const ps = await names(list.map(d => d.id).filter(id => id !== 'me' && id !== myId));
    const who = d => (d.id === myId || d.id === 'me') ? 'You' : ((ps[d.id] && ps[d.id].name) || 'Someone');
    $('#tally').innerHTML = '';
    CS.forEach(c => {
      const rows = list.filter(d => d[c] && d[c].d);
      const a = rows.filter(d => d[c].d === 'approve').length, ch = rows.length - a;
      const li = document.createElement('li');
      li.textContent = rows.length ? `${c}: ${a} approved, ${ch} changes requested` : `${c}: none yet`;
      $('#tally').appendChild(li);
      const o = $('.others', boxes[c]); o.textContent = '';
      if (rows.length) {
        const p = document.createElement('div'); p.textContent = 'Decisions on this concept:'; o.appendChild(p);
        const ul = document.createElement('ul');
        rows.forEach(d => { const it = document.createElement('li'); it.textContent = `${who(d)}: ${LABEL[d[c].d] || d[c].d}${d[c].n ? ' (' + d[c].n + ')' : ''}`; ul.appendChild(it); });
        o.appendChild(ul);
      }
    });
  }
  $('#copy').addEventListener('click', async () => {
    const lines = ['Decisions on "{{TITLE_JS}}"'];
    CS.forEach(c => lines.push(`${c}: ${mine[c].d ? LABEL[mine[c].d] : 'no decision'}${mine[c].n ? ' | ' + mine[c].n : ''}`));
    const text = lines.join('\n'); const box = $('#copybox');
    try { await navigator.clipboard.writeText(text); setMode('Copied. Paste it wherever you send feedback.'); box.hidden = true; }
    catch { box.hidden = false; box.value = text; box.select(); setMode('Select the text below and copy it.'); }
  });
  (async () => {
    if (!window.claude || typeof window.claude.use !== 'function') { setMode('Decisions are kept on this page only. Open it from its claude.ai link to save them for the team.'); renderTally(); return; }
    const timer = setTimeout(() => { if (!loaded) setMode('Still connecting to shared decisions…'); }, 10000);
    try { db = await window.claude.use('db'); user = await window.claude.use('user'); } catch { db = null; }
    if (!db) { clearTimeout(timer); setMode('Shared decisions are unavailable here (sign in on claude.ai). Use "Copy my decisions".'); renderTally(); return; }
    try { myId = user ? await user.id() : null; } catch { myId = null; }
    if (!myId) { clearTimeout(timer); db = null; setMode('Sign in to save decisions for the team. Use "Copy my decisions" meanwhile.'); renderTally(); return; }
    try { if (user.can) { const w = await user.can('data.write'); if (w === false) writable = false; } } catch {}
    setMode(writable ? 'Decisions you save are shared with everyone who has this link.' : 'You can read decisions; your access does not allow saving.');
    db.collection('decisions').onSnapshot(snap => {
      if (!snap.metadata.fromCache) { loaded = true; clearTimeout(timer); }
      docs = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
      const me = docs.find(d => d.id === myId);
      if (me && !hydrated) { hydrated = true; CS.forEach(c => { if (me[c]) { mine[c] = { d: me[c].d, n: me[c].n || '' }; paint(c); } }); }
      renderTally();
    }, () => { clearTimeout(timer); setMode('Shared decisions could not be loaded. Use "Copy my decisions".'); });
  })();
</script>
</body>
</html>

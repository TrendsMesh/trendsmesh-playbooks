[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tm"
version = "0.14.0-rc.2"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.package-data]
tm = ["*.html", "*.css", "schemas/*.json", "brief_pack/*.html", "brief_pack/*.css", "organic_pages/*.css"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tm"
version = "0.13.1"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.package-data]
tm = ["*.html", "*.css", "schemas/*.json", "animatic_js/*.js", "brief_pack/*.html", "brief_pack/*.css", "organic_pages/*.css"]

[tool.setuptools.packages.find]
where = ["src"]

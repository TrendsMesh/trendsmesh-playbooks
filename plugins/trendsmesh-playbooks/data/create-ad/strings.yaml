# Fixed words of playbook 05 "Create an ad" that the user reads: card and page labels, the placement facts, the
# pixel sentences, the upload's outcome. One keyed English table, so they can move onto the shared translation
# mechanism (tm.i18n, issue #3) without touching the engine: code reads them only through tm.create_strings.text.
# {name} placeholders are filled by the engine. Words the agent writes (concepts, scripts, copy) are not here.
en:
  # the copy page and card (S8, CA13)
  copy.title: "Meta copy"
  copy.question: "Do you want to change anything?"
  copy.primary: "Primary text"
  copy.headline: "Headline"
  copy.description: "Description"
  copy.keep: "Keep"
  copy.count: "{n} of {limit} characters"
  copy.over: "{n} of {limit} characters: too long"
  copy.facts: "Ad name, video title, call to action, display link and URL"
  # the upload proposal (S10a, CA14)
  upload.title: "Upload to Meta, PAUSED"
  upload.question: "Shall I create these in your ad account, PAUSED?"
  upload.paused_note: "Everything is created PAUSED: nothing runs and nothing is spent until you switch it on yourself in Ads Manager."
  upload.fact.no_description: "Video ads show no description on Facebook Feed or Instagram."
  upload.fact.display_link: "The display-link line is being removed from Facebook mobile Feed."
  upload.pixel.none: "This site has no pixel, so Meta can't optimise for or report conversions: the ad can optimise for clicks, with the UTM link to see visits in your analytics. We can also wait until the pixel is set up."
  upload.pixel.silent: "This site's pixel ({dataset}) sends no events, so Meta can't optimise for or report conversions: the ad can optimise for clicks, with the UTM link to see visits in your analytics. We can also wait until the pixel fires."
  upload.ai.question: "Do these ads contain media created or edited with generative AI?"
  upload.budget.question: "How much do you want to spend, and per day or for the whole run?"
  # the upload's outcome (S10b)
  upload.created.paused: "Created PAUSED: the campaign, ad set, creative and ad are in your ad account, switched off."
  upload.created.draft: "Created as a draft: the campaign, ad set, creative and ad are in your ad account and not published."
  upload.activate_howto: "To switch it on: open Ads Manager, find the campaign {campaign}, and turn on the campaign, the ad set and the ad. Nothing in this run switches it on."
  upload.active_found: "{what} is not paused in Meta ({status}). Nothing should run from this playbook: pause it now in Ads Manager (or with the Meta Ads connector), then record the objects again."

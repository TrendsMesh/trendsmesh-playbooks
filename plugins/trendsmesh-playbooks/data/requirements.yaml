    outputs: []
    kind: mcp
    mcp: artifacts
    fixer: user
    fix: {any: "This session can't publish claude.ai artifacts (it has no Artifact tool), so the page is saved as a file you can open and share."}
    warn: true
    warn_note: "Without shared page links you get the page as a local file, and decisions are taken here in chat."
    unchecked: "Not checked yet: I look whether this session can publish shared page links, then look again."

  - id: browser_for_animatics

    fix_by_state:
      skipped: "You chose to go on without TrendsMesh, but trend research has nothing to report without it. Say so when you want to sign in."
      no_agents: "Your TrendsMesh plan doesn't include connecting an agent yet, so I can't read trend data. Choose the Agent plan at https://trendsmesh.com/plans, then say continue."
    unchecked: "Not checked yet: I check it with one quick TrendsMesh call, then look again."
  - id: trendsmesh_agent_plan_research

    outputs: []
    kind: plan
    mcp: meta
    plan_of: not_enabled
    fixer: user
    fix: {any: "Meta turns its Ads connector on account by account, and yours is not on yet. In Meta Business settings, ask for access to the Ads connector (MCP) for this ad account, then say continue."}
    unchecked: "Can't be checked until Meta Ads is connected and signed in."

  # Trend research (04): every number comes from TrendsMesh, so it is not a warning there; the
  # Meta Ad Library (the paid check) and the artifacts tools (the page's link) are.
  - id: mcp_trendsmesh_research
    name: TrendsMesh connected and signed in
    playbooks: [04-trend-research]
    outputs: []
    kind: mcp
    mcp: trendsmesh
    fixer: user

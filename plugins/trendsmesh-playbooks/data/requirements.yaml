      no_plan: "You're on the free TrendsMesh plan: it has no trend data. Choose the Agent plan at https://trendsmesh.com/plans, then say continue."
      inactive: "Your TrendsMesh account is not active, so it gives no trend data. Open https://trendsmesh.com/app/plan to see why."

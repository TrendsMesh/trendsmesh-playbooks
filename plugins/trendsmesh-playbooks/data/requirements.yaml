# Readiness checks. The doctor (tm/doctor.py) reads this file; the engine knows no check by name
# except how to test each `kind`.
#
# kind:  env_tier (tier), secret (secret), disk_gb, mcp (mcp), plan (mcp, plan_of), browser (the
#        user's Chrome or Edge that draws the animatics, tm/atlas.py)
# fixer: agent (installs, after the user's yes) or user
# fix:   plain words per system (windows, macos, linux, any). {tier} {size} {minutes} {need}
#        {free} {missing} {asound} are filled in by the doctor. The card is the user's first
#        screen: no commands or flags in any text.
# when:  a list of alternatives; the check applies if ANY alternative holds, and an alternative
#        holds when ALL its keys hold: outputs (any of), voice, caption_removal, os, tier
#        (that tier is chosen), production (organic video's production type is one of these:
#        `tm doctor --production`), not_production (it is none of these, or none is given). No
#        `when` means the check always applies.
# unchecked: what the card says when the fact was not passed in (mcp and plan checks).
# fix_by_state: for mcp and plan checks, the fix text for one MCP state (in place of `fix`).
# plan_of: for plan checks on an MCP, the MCP states that mean the plan is missing (one or a list).
# warn:  true means the run can go on without it: the card shows it as a warning, with its
#        `warn_note`, and it does not make the run not ready.
# warn_note: the line the card shows for that warning (once, however many warnings share it);
#        absent means the guess-mode notice (tm/evidence.py NOTICE_SHORT).
# ok_states: for mcp checks, the MCP states that count as ok; absent means connected (ok,
#        not_enabled, no_plan, free, inactive), so a plan check on the same MCP says the rest.
# playbooks: the playbooks (data/playbooks.yaml ids) the check is for; absent means
#        [01-refresh-ad]. `general` is the doctor's general check, when no playbook is chosen (`tm doctor
#        --general`). A playbook other than refresh-ad needs every tier its env_tier
#        checks name, those with a `when` only when it holds for the run's outputs; refresh-ad's
#        tiers follow its outputs (tm/envtiers.py).
checks:
  - id: tier_base
    name: Base tools
    playbooks: [01-refresh-ad, 02-creative-brief, 03-organic-ai-video, 04-trend-research, 05-create-ad, general]
    outputs: [creative_brief, edited_video, ai_video, live_test]
    kind: env_tier
    tier: base
    fixer: agent
    fix: {any: "I install the base tools (about {size}, about {minutes} min). Say yes and I start."}
  - id: tier_breakdown
    name: Video breakdown tools (transcription and scene detection)
    playbooks: [01-refresh-ad, 03-organic-ai-video, 05-create-ad]
    # an animation is drawn, not generated: no take to break down (issue 87)
    when: [{outputs: [organic_video], not_production: [animation]}, {outputs: [video_ad]}]
    outputs: [creative_brief, edited_video, ai_video]
    kind: env_tier
    tier: breakdown
    fixer: agent
    fix: {any: "I install the video breakdown tools (about {size}, about {minutes} min). Say yes and I start."}
  - id: tier_video
    name: Video editing tools (Remotion)
    # Create an ad's edit is built with the plugin's ffmpeg (base tier), never Remotion (issue 96)
    playbooks: [01-refresh-ad, 03-organic-ai-video]
    when: [{outputs: [organic_video]}]
    outputs: [edited_video]
    kind: env_tier
    tier: video
    fixer: agent
    fix: {any: "I install the video editing tools (about {size}, about {minutes} min). Say yes and I start."}
  - id: tier_voice
    name: Voice tools (new voiceover)
    playbooks: [01-refresh-ad, 03-organic-ai-video, 05-create-ad]
    when: [{outputs: [organic_video]}, {outputs: [video_ad]}]
    outputs: []
    kind: env_tier
    tier: voice
    fixer: agent
    fix: {any: "I install the voice tools (about {size}, about {minutes} min). Say yes and I start."}
  - id: tier_ai
    name: AI video tools
    playbooks: [01-refresh-ad, 03-organic-ai-video, 05-create-ad]
    when: [{outputs: [organic_video], not_production: [animation]}, {outputs: [video_ad]}]
    outputs: [ai_video]
    kind: env_tier
    tier: ai
    fixer: agent
    fix: {any: "I install the AI video tools (about {size}, about {minutes} min). Say yes and I start."}
  - id: tier_animatic
    name: Animatic tools (the animatic renderer)
    playbooks: [02-creative-brief, 03-organic-ai-video]
    when: [{outputs: [animatics]}, {outputs: [organic_video], production: [animation]}]
    kind: env_tier
    tier: animatic
    fixer: agent
    fix: {any: "I install the animatic tools (about {size}, about {minutes} min). Say yes and I start."}

  - id: replicate_api_token
    name: Replicate token
    outputs: [ai_video, edited_video]
    when:
      - {outputs: [ai_video]}
      - {outputs: [edited_video], caption_removal: true}
    kind: secret
    secret: replicate_api_token
    fixer: user
    check: replicate       # one free call says works, connected but unusable or missing (#66)
  - id: elevenlabs_api_key
    name: ElevenLabs key
    outputs: [edited_video]
    when: [{voice: true}]
    kind: secret
    secret: elevenlabs_api_key
    fixer: user
    check: elevenlabs       # one free call says works, connected but unusable or missing (#66)
  - id: elevenlabs_cloning_plan
    name: ElevenLabs plan includes voice cloning
    outputs: [edited_video]
    when: [{voice: true}]
    kind: plan
    fact: elevenlabs_plan
    needs_key: elevenlabs_api_key     # skipped while the key is missing: the key row comes first
    fixer: user
    fix: {any: "Your ElevenLabs plan does not include voice cloning (it comes with the Starter plan and above), so a clone of the ad's voice is not available."}
    # Unknown never blocks the start (#5): a clone is needed only if V1c does not find the original voice, and V3
    # checks the plan then (`tm tool elevenlabs credits`). A plan known to lack cloning waits for V3 too
    # (short_warns): V3 stops there with the choices, only if a clone is needed.
    unknown_warns: true
    short_warns: true
    unchecked: "Whether your ElevenLabs plan includes voice cloning is not checked yet, and there is nothing to do now."
    warn_note: "Voice cloning matters only if the new voice line needs a clone of the ad's voice: I check your plan at the voice step, and only if the original voice is not in your ElevenLabs history."
    short_note: "That matters only if the new voice line needs a clone of the ad's voice: at the voice step, if the original voice is not in your ElevenLabs history, I stop there and you choose a plan with voice cloning, a stock voice, or no voice change."

  - id: disk_free
    name: Free disk space
    playbooks: [01-refresh-ad, 02-creative-brief, 03-organic-ai-video, 04-trend-research, 05-create-ad, general]
    outputs: []
    kind: disk_gb
    fixer: user
    fix: {any: "Free up about {need} on the drive that holds the plugin data (it has {free} free), then say continue."}
  - id: mcp_trendsmesh
    name: TrendsMesh connected and signed in
    outputs: []
    kind: mcp
    mcp: trendsmesh
    fixer: user
    fix: {any: "Open /mcp, choose trendsmesh, and sign in. It's free and takes a minute: it's how I find what's rising right now."}
    fix_by_state:
      skipped: "You chose to go on without TrendsMesh. Say so any time and I'll help you sign in."
      no_agents: "Your TrendsMesh plan doesn't include connecting an agent yet, so I can't read trend data."
    warn: true
    unchecked: "Not checked yet: I check it with one quick TrendsMesh call, then look again."
  - id: trendsmesh_agent_plan
    name: TrendsMesh Agent plan
    outputs: []
    kind: plan
    mcp: trendsmesh
    plan_of: [no_plan, free, inactive]
    fixer: user
    fix: {any: "Trend data needs the TrendsMesh Agent plan: https://trendsmesh.com/plans"}
    fix_by_state:
      free: "You're on the free TrendsMesh plan: it has no trend data."
      no_plan: "You're on the free TrendsMesh plan: it has no trend data."
      inactive: "Your TrendsMesh account is not active, so it gives no trend data. Open https://trendsmesh.com/app/plan to see why."
    warn: true
    unchecked: "Can't be checked until TrendsMesh is connected and signed in."
  # Creative brief (02) runs as labelled guesses without TrendsMesh (decisions §4), so its two
  # TrendsMesh rows warn with its own notice (tm/evidence.py NOTICES; one warn_note per row).
  - id: mcp_trendsmesh_brief
    name: TrendsMesh connected and signed in
    playbooks: [02-creative-brief]
    outputs: []
    kind: mcp
    mcp: trendsmesh
    fixer: user
    fix: {any: "Open /mcp, choose trendsmesh, and sign in. It's free and takes a minute: it's how I find what's rising right now."}
    fix_by_state:
      skipped: "You chose to go on without TrendsMesh. Say so any time and I'll help you sign in."
      no_agents: "Your TrendsMesh plan doesn't include connecting an agent yet, so I can't read trend data."
    warn: true
    warn_note: "Without live trend data, the hooks in these concepts are my best guess from your customers' own words, your ads and the Ad Library, not proof from what is rising now."
    unchecked: "Not checked yet: I check it with one quick TrendsMesh call, then look again."
  - id: trendsmesh_agent_plan_brief
    name: TrendsMesh Agent plan
    playbooks: [02-creative-brief]
    outputs: []
    kind: plan
    mcp: trendsmesh
    plan_of: [no_plan, free, inactive]
    fixer: user
    fix: {any: "Trend data needs the TrendsMesh Agent plan: https://trendsmesh.com/plans"}
    fix_by_state:
      free: "You're on the free TrendsMesh plan: it has no trend data."
      no_plan: "You're on the free TrendsMesh plan: it has no trend data."
      inactive: "Your TrendsMesh account is not active, so it gives no trend data. Open https://trendsmesh.com/app/plan to see why."
    warn: true
    warn_note: "Without live trend data, the hooks in these concepts are my best guess from your customers' own words, your ads and the Ad Library, not proof from what is rising now."
    unchecked: "Can't be checked until TrendsMesh is connected and signed in."
  # Meta Ads is required for refresh-ad and creative brief (its PLAYBOOK manifest): no warn.
  - id: mcp_meta
    name: Meta Ads connected and signed in
    playbooks: [01-refresh-ad, 02-creative-brief]
    outputs: []
    kind: mcp
    mcp: meta
    fixer: user
    fix: {any: "Open /mcp, choose the Meta Ads connector, and sign in to Meta."}
    unchecked: "Not checked yet: I check it with one quick Meta Ads call, then look again."
  - id: meta_mcp_enabled_for_account
    name: Meta Ads enabled for your ad account

    name: TrendsMesh connected and signed in
    playbooks: [05-create-ad]
    outputs: []
    kind: mcp
    mcp: trendsmesh
    fixer: user
    fix: {any: "Open /mcp, choose trendsmesh, and sign in. It's free and takes a minute: it's how I find the ads and trends rising right now."}
    fix_by_state:

    kind: linux_libs
    fixer: user
    fix:
      linux: "Run this one command in a terminal, then say continue (it needs your password; from Remotion's Linux dependencies page, not verified here): sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev {asound} libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2"

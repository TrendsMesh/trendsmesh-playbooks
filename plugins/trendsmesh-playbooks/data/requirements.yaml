    outputs: []
    kind: plan
    mcp: trendsmesh
    plan_of: [no_plan, free, inactive]
    fixer: user
    fix: {any: "Trend data needs the TrendsMesh Agent plan: https://trendsmesh.com/plans"}
    fix_by_state:
      free: "You're on the free TrendsMesh plan: it has no trend data. Choose the Agent plan at https://trendsmesh.com/plans, then say continue."
      no_plan: "You're on the free TrendsMesh plan: it has no trend data. Choose the Agent plan at https://trendsmesh.com/plans, then say continue."
      inactive: "Your TrendsMesh account is not active, so it gives no trend data. Open https://trendsmesh.com/app/plan to see why."
    unchecked: "Can't be checked until TrendsMesh is connected and signed in."
  - id: meta_ad_library_research
    name: Meta Ad Library connected and signed in
    playbooks: [04-trend-research]
    outputs: []
    kind: mcp
    mcp: meta
    ok_states: [ok]
    fixer: user
    fix: {any: "Open /mcp, choose the Meta Ads connector, and sign in to Meta."}
    fix_by_state:
      not_enabled: "Meta turns its Ads connector on account by account, and yours is not on yet. In Meta Business settings, ask for access to the Ads connector (MCP), then say continue."
    warn: true
    warn_note: "Without the Meta Ads connector the paid check says 'not checked'; the report is otherwise complete."
    unchecked: "Not checked yet: I check it with one quick Meta Ads call, then look again."
  # The claude.ai artifacts tools (the built-in Artifact tool of Claude Code in the Claude desktop
  # app, or the older publish_files) are not added through /mcp: without them the page is a local

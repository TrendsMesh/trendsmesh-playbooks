      no_agents: "Your TrendsMesh plan doesn't include connecting an agent yet, so I can't read trend data."
    warn: true
    warn_note: "Without live trend data, the model ads and trends in these concepts are my best guess: ads from the Meta Ad Library where it returns any (its search covers mainly ads shown in the EU) and formats I know, not proof from what is rising now."
    unchecked: "Not checked yet: I check it with one quick TrendsMesh call, then look again."

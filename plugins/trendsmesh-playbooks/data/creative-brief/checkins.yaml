# Check-in catalogue for playbook 02 "Creative brief". The keys (route, card, choices, on_choice
# and its effects) are those of data/checkins.yaml (refresh-ad), which explains each one.
#
# Source: handoff/creative-brief_v02 FLOWS.md section G (G1, G3, G4, each AUTO rule in `rule`
# here; its G2 went in issue #145). The rest is the plugin's:
# - G0, the intake card: FLOWS.md A1's "card confirmation (AUTO: logged)", given an id as in
#   trend research;
# - G1's "(lowest cost per result)": PLAYBOOK.md step 1's AUTO column; `tm audience pick` applies
#   the rule;
# - no concept check-in (issue #145): the concepts are decided per concept on D3's page (approve, ask for
#   changes, drop), recorded with `tm brief choose` (`concepts_chosen`), and G3 closes on it; G3's and G4's
#   "as is" (FLOWS.md "published"); a run started before issue #145 may hold a G2 decision: no longer a
#   check-in, so the flow reads past it (done);
# - `animatics` (issue #145, CB11 on request): asked after G3, before D2; `make` names the concepts
#   (`tm decide animatics make --concepts C1,C3`, the effect `concepts`), `skip` skips D2. Hands-off makes none;
# - every other choice is `accept`: what changes is recorded with `tm brief choose` and on the page,
#   and the check-in is then closed with `tm decide` (decisions §5);
# - the mapping to the levels: the plan's decision 5. Check every step asks each on its own; Just the
#   big calls asks "Approve the setup" (G0 and G1, after B1), `animatics` on its own (after D3), and
#   "Approve the briefs" (G3 and G4, after E1); Hands-off decides all by rule.
# PB2 has no money check-in: nothing in it spends.

levels:
  every_step: Check every step
  big_calls: Just the big calls
  hands_off: Hands-off

cards:
  approve_setup:
    name: Approve the setup
    ask: last
  approve_briefs:
    name: Approve the briefs
    ask: last

checkins:
  - id: G0
    name: Confirm the intake card
    card: approve_setup
    route: {every_step: own, big_calls: card, hands_off: rule}
    rule: "logged: the card as derived (FLOWS A1, AUTO: logged)"
    choices: [accept]

  - id: G1
    name: Accept the persona and target segment
    card: approve_setup
    route: {every_step: own, big_calls: card, hands_off: rule}
    rule: >-
      ≥ 10 results per segment (lowest cost per result), else the thin-data fallback: largest
      directional cluster, cross-checked, marked directional (`tm audience pick`)
    choices: [accept]

  - id: G3
    name: Decide on the briefs
    card: approve_briefs
    route: {every_step: own, big_calls: card, hands_off: rule}
    rule: "published as is, every concept kept (`tm brief choose --source rule`)"
    choices: [accept]
    on_choice: {accept: {requires: [concepts_chosen]}}

  - id: animatics
    name: Make animatics?
    route: {every_step: own, big_calls: own, hands_off: rule}
    rule: "skip: Hands-off makes no animatic (CB11, on request only)"
    choices: [make, skip]
    on_choice: {make: {concepts: true}}

  - id: G4
    name: Accept the production views
    card: approve_briefs
    route: {every_step: own, big_calls: card, hands_off: rule}
    rule: "published as is"
    choices: [accept]

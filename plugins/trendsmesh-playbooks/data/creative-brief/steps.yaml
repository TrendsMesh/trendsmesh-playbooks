# Steps of playbook 02 "Creative brief", in order: handoff/creative-brief_v02 FLOWS.md sections
# A to F. The keys are those of data/steps.yaml (refresh-ad), which explains each one, plus
# `requires`:
#
# requires: engine checks (tm/stepchecks.py `NAMES`) that must pass on the run's latest files
#   before `tm done <step>`; a gap is a stop that says what to fix. This is how the CB rules are
#   enforced by the engine rather than trusted to the skill (the plan's decision 2).
#
# outputs: the spec's (PLAYBOOK.md "Config") but animatics, which are made on request (CB11, issue
# #145: the `animatics` check-in before D2, which skips D2 on `skip`). The review pack alone ends at C1's
# page, decided there, then the hand-off; the briefs add D1 to E1. `tm config check` refuses a run without
# `page` (CB12). A run started before issue #145 lists `animatics` too: a legacy output, left out
# (brief_config.LEGACY_OUTPUTS, state.load).
# No concept check-in (issue #145): C1 goes straight on to D1, which writes every concept in full; each
# concept is approved, sent back or dropped on D3's page (G3), and the choice (`tm brief choose`,
# `concepts_chosen`) is checked at E1 and E2.
# Two kinds of brief (issue #136): the check-in `brief_kind` before A0 says which. The ad brief's steps
# (A1 to E2) have `skip_when: {brief_kind: organic}`, the organic video brief's (O1 to O8) `skip_when:
# {brief_kind: ad}`; A0 and D2 (the animatics on request) serve both. B2 (customer voice, CB5) and the Ad
# Library check (B4, CB4) belong to the ad brief alone.
# The plugin's merges: A0 is FLOWS.md A0 and A2 (the run folder is made with the stack check);
# E1 is FLOWS.md E1 to E3 (the creator, editor and media-buyer views come from one brief.json,
# CB10); E2 is FLOWS.md F (decisions and the hand-off to PB1).
# Nothing spends: PB2 has no paid step and no budget (FLOWS.md legend).

outputs: [review_pack, briefs, page, organic_brief]

steps:
  # A. Intake and setup
  - {id: A0, title: Stack check and run folder, outputs: [review_pack, briefs, page, organic_brief], before: [brief_kind], spends: false, ref: "skills/creative-brief/references/flow.md#a0"}
  - {id: A1, title: Product and intake card, outputs: [review_pack, briefs, page], checkins: [G0], requires: [intake_written], skip_when: {brief_kind: organic}, spends: false, ref: "skills/creative-brief/references/flow.md#a1"}
  # B. Research (CB1 to CB5)
  - {id: B1, title: Account context and persona, outputs: [review_pack, briefs, page], checkins: [G1], requires: [audience_picked], skip_when: {brief_kind: organic}, spends: false, ref: "skills/creative-brief/references/flow.md#b1"}
  - {id: B2, title: Customer voice, outputs: [review_pack, briefs, page], requires: [voice_checked], skip_when: {brief_kind: organic}, spends: false, ref: "skills/creative-brief/references/flow.md#b2"}
  - {id: B3, title: Rising trends, outputs: [review_pack, briefs, page], requires: [trends_or_guess], skip_when: {brief_kind: organic}, spends: false, ref: "skills/creative-brief/references/flow.md#b3"}
  - {id: B4, title: Fit scoring and saturation, outputs: [review_pack, briefs, page], requires: [scores_and_saturation], skip_when: {brief_kind: organic}, spends: false, ref: "skills/creative-brief/references/flow.md#b4"}
  # C. Concepts (CB6, CB7)
  - {id: C1, title: Concepts and the review pack, outputs: [review_pack, briefs], requires: [concepts_checked, page_built], skip_when: {brief_kind: organic}, spends: false, ref: "skills/creative-brief/references/flow.md#c1"}
  # D. Briefs, their page, and the animatics on request (CB10 to CB12)
  - {id: D1, title: Briefs, outputs: [briefs], requires: [brief_checked], skip_when: {brief_kind: organic}, spends: false, ref: "skills/creative-brief/references/flow.md#d1"}
  - {id: D3, title: Page with the briefs, outputs: [briefs], checkins: [G3], requires: [page_built], skip_when: {brief_kind: organic}, spends: false, ref: "skills/creative-brief/references/flow.md#d3"}
  - {id: D2, title: Animatics on request, outputs: [briefs], before: [animatics], skip_when: {animatics: skip}, requires: [animatics_rendered, page_built], spends: false, ref: "skills/creative-brief/references/flow.md#d2"}
  # E. Production views (CB13)
  - {id: E1, title: Production views, outputs: [briefs], checkins: [G4], requires: [concepts_chosen, production_checked, page_built], skip_when: {brief_kind: organic}, spends: false, ref: "skills/creative-brief/references/flow.md#e1"}
  # F. Decisions and the hand-off
  - {id: E2, title: Hand-off, outputs: [review_pack, briefs, page], requires: [concepts_chosen, page_built, handed_off], skip_when: {brief_kind: organic}, spends: false, ref: "skills/creative-brief/references/flow.md#e2"}

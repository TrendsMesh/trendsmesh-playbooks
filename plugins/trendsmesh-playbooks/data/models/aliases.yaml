# The same model's name in each public ranking and on Replicate (issue #115, section 1): the two-weekly review
# (.github/scripts/model_review.py) matches the rankings to the registry through this table. A name it cannot match
# is listed in the review issue as "to match"; the maintainer adds it here after the owner's review.
#
# registry id: {arena: [names on Arena's leaderboards], artificial_analysis: [names on Artificial Analysis],
#               replicate: owner/name, elevenlabs: model id}. The names were read on 2026-11-17; a bracketed variant
# ("(Medium)", "(720p)") and a maker's prefix ("Dreamina") are ignored when matching.


routes:
  # The talking person, by situation (Create an ad's CA5, presenter.situation; Organic AI video's host). Prices per
  # 10 s: Gemini Omni $1.05, H3 $0.80, Seedance 2.0 $1.80, Seedance 2.5 $2.31.
  talking_person:
    shown_per: 10
    situations:
      described: {model: bytedance/seedance-2.0, variant: 720p, also: [bytedance/seedance-2.5], voice: native, casting: none}
      specific_person: {model: minimax/h3, variant: 768P, voice: native, casting: face}
      own_voice: {model: google/gemini-omni-1.2-flash, variant: 720p, then: eleven_multilingual_sts_v2, voice: voice_changer, casting: reference}
      exact_wording: {model: google/gemini-omni-1.2-flash, variant: 720p, star: true, voice: native, casting: reference}
      fallback: {model: kwaivgi/kling-avatar-v2, variant: std, plus: eleven_v4, voice: elevenlabs, casting: face}
  # The voice: who is on screen and whether the user has their own recording.
  voice:
    - {on_screen: false, recording: true, route: user_recording}
    - {on_screen: false, recording: false, route: voiceover, model: eleven_v4}
    - {on_screen: true, recording: true, route: lipsync, model: kwaivgi/kling-avatar-v2, budget: prunaai/p-video-avatar}
    - {on_screen: true, recording: false, route: native, model: google/gemini-omni-1.2-flash, then: eleven_multilingual_sts_v2}
  lipsync_fallback: {model: kwaivgi/kling-avatar-v2, when: "takes from the video models keep failing"}
  # A speech longer than one take.
  long_speech: {takes: several, keep: [reference_image, voice], cut: sentence_end}

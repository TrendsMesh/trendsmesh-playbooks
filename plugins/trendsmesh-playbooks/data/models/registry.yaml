    inputs: [prompt, input_images, aspect_ratio, quality, output_format]
    cannot: [quality_auto]
    tested: {date: 2026-11-17, result: "suggested for photos (medium), best at high"}
    variants:
      low: {send: {quality: low, output_format: png}, price: {usd: 0.012, per: image}, live: {criteria: "model variant=low"}}
      medium: {send: {quality: medium, output_format: png}, price: {usd: 0.047, per: image}, live: {criteria: "model variant=medium"}}
      high: {send: {quality: high, output_format: png}, price: {usd: 0.128, per: image}, live: {criteria: "model variant=high"}}
    tasks:
      photos: [{variant: low, group: budget}, {variant: medium, group: suggested, star: true}, {variant: high, group: best}]
      illustrations: [{variant: low, group: budget}, {variant: high, group: best}]
      image_edit: [{variant: low, group: budget}, {variant: medium, group: suggested}]


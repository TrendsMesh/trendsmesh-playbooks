# The model registry (issue #115): the one list of models every paid call reads.
#
# Each model: its id (owner/name on Replicate, or the ElevenLabs model id), provider (replicate, elevenlabs, or
# local for a free tool on the user's machine), status (active; new: found by the review, not tested, never shown;
# removed), name, good_for (one sentence, the only words the user sees with the price), recipe (its file in
# references/model-prompting/), inputs and cannot (what it takes and its hard limits), tested (the owner's test,
# internal only), variants and tasks.
#
# A variant is what the plugin always sends (`send`: quality, resolution, fps, audio) and its price as the provider
# bills it (`price`: usd or credits, `per` image, second, run, character or minute, and the day it was read,
# `checked`, which defaults to `checked:` below). `live.criteria` names the tier of Replicate's price file
# (tm tool replicate_price) that prices the variant in a run, and `live.factor` turns that tier's price into the
# registry's unit (Topaz bills in units of $0.08; p-image's page prices 1,000 images).
#
# tasks: per task the variant offered, its group (budget, suggested, best) and `star: true` for the one selected in
# advance (one per task). routes: which model by situation, so no prose lists models.
#
# Nothing here changes without the owner's review (the two-weekly review issue, .github/workflows/model-review.yml):
# the maintainer applies exactly the decisions the owner writes there.

version: 1
checked: 2026-11-17          # the day the prices were read on Replicate and ElevenLabs
tested: 2026-11-17           # the owner's blind test that set the groups and the stars

tasks:
  photos: {label: "Photos (person, product)", unit: image}
  illustrations: {label: "Illustrations and graphics with text", unit: image}
  image_edit: {label: "Image edit with references (the same character)", unit: image}
  image_to_video: {label: "Image to video", unit: second, shown_per: 15}
  text_to_video: {label: "Text to video", unit: second, shown_per: 15}
  talking_person: {label: "Talking person", unit: second, shown_per: 10}
  lipsync: {label: "Lip-sync to a recording", unit: second, shown_per: 10}
  upscale: {label: "Upscale to 1080p", unit: second, shown_per: 15}
  voiceover: {label: "Voiceover", unit: character}
  sound_effects: {label: "Sound effects", unit: second}
  voice_changer: {label: "Voice changer", unit: minute}
  music: {label: "Music", unit: second}
  inpainting: {label: "Inpainting and caption removal", unit: second}
  voice_cloning: {label: "Voice cloning", unit: run}
  voice_isolation: {label: "Voice isolation", unit: minute}
  transcription: {label: "Transcription for QA", unit: minute}


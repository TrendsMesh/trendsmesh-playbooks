# --- Refresh an ad: the winning ad moved into the original's campaign, PAUSED, at G12 (issue #64;
# engine/src/tm/livetest_move.py, skills/refresh-ad/references/flow.md#e4) ---
refresh:
  move:
    title: Move the winning ad to your campaign, PAUSED
    question: "Shall I create a new ad set in your campaign {campaign}, PAUSED, with the winning ad from the test's post?"
    post_note: "The ad uses the test ad's post, so its likes, comments and shares come along."
    own_adset_note: "It goes into a new ad set, never into your original ad's ad set: a new ad there would restart that ad set's learning."
    settings_note: "The new ad set copies your original ad set's targeting, placements, optimisation event and bid strategy."
    budget_campaign: "Your campaign {campaign} holds the budget, so the new ad set gets none of its own."
    budget_question: "How much a day should the new ad set spend once you switch it on?"
    budget_reference: "For reference, your original ad set spends {budget} a day."
    paused_note: "Everything is created PAUSED: nothing runs and nothing is spent until you switch it on yourself in Ads Manager."
    created: "Created PAUSED: the new ad set {adset} and its ad {ad} are in your campaign {campaign}, switched off."
    steps_title: "Your part, step by step:"
    step_switch_on: "Switch it on: in Ads Manager, open the campaign {campaign} and turn on the ad set {adset} and its ad {ad}."
    step_budget: "Move the budget: the new ad set starts at the daily budget you named ({budget}); lower your original ad's ad set {original_adset} by the same amount, and move more in steps while you watch the cost per result."
    step_budget_campaign: "Move the budget: your campaign {campaign} holds the budget, so as soon as you switch the new ad set on, Meta can move budget away from your original ad set {original_adset} at once. For a gradual move, set ad set spend limits first (a daily maximum on the new ad set and a daily minimum on the original's), then widen them in steps while you watch the cost per result."
    step_switch_off: "Switch the original off: once the new ad delivers, turn off your original ad {original_ad}."
    never_on: "Nothing in this run switches anything on or off: these steps are yours."
    active_found: "{what} is not paused in Meta ({status}). Nothing should run from this playbook: pause it now in Ads Manager (or with the Meta Ads connector), then record the objects again."

# --- The recorded voiceover against the plan (issue 88): engine/src/tm/organic_vo.py, `tm organic vo-sync` and the
# paid take's guard. Agent-facing: what to change before the take is paid for.
vo_sync:
  no_pack: "There is no checked pack to compare the voiceover with. Check the pack first (tm organic pack check --stage pack)."
  bad_words: "{file} could not be read as word times ({why}). Give the <stem>.words.json that tm tool elevenlabs tts --timestamps wrote."
  bad_spec: "The take spec {file} could not be read ({why}). Nothing was compared."
  no_brackets: "The take spec {file} has no timed shot list in input.prompt ([0 to 3 seconds] …), so there are no cuts to compare. Leave out --spec to compare the line times only."
  unmatched: "{file} holds {recorded} recorded words, and the pack's said lines hold {said}: the take was not recorded from the pack's lines, so nothing was compared. Record the pack's lines as they are written (numbers in words), or write the lines that were recorded into the next pack."
  in_sync: "The recorded voiceover follows the pack: every line within 0.3 s of its planned time and every cut on its line, at {pace} words a second."
  lines_moved: "The recorded lines are more than 0.3 s from the pack's times; proposed `at` from the word times: {lines}."
  cuts_moved: "The take's cuts do not follow the voice; proposed cuts from the word times: {cuts}."
  longer: "The voice runs {voice} s, longer than the pack's {seconds} s: re-plan the pack (E2) before any take."
  slow: "Under qa.wps_min (words a second): {lines}. Add words to those lines, or record them again at a brisker read, before the take."
  todo: "Write the new times into the next pack (`script.lines[].at`) and the take's prompt (its brackets), check the pack again, then make the take. This is free, and nothing paid has run."
  take_refused: "The take is not run: its prompt cuts away from the recorded voiceover ({words}), so a line would start over the wrong scene. Move the cuts to the word times: {cuts}. Write them into the take's prompt (and the pack's `script.lines[].at`, then check the pack again)."

name: Changelog

# A pull request that changes the plugin says so in CHANGELOG.md, under ## Unreleased (RELEASING.md), unless it is
# labelled no-changelog. Its own workflow, so adding or removing the label runs only this check again.
on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      # The pull request's labels now, not the event's: `gh pr create --label` opens the pull request before it
      # adds the label, and a re-run replays its event's labels.
      - name: Labelled no-changelog?
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qx no-changelog; then
            echo "Labelled no-changelog: nothing to check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.label.outputs.skip != 'true'
        with:
          fetch-depth: 0
      - name: A plugin change has a changelog line
        if: steps.label.outputs.skip != 'true'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          if printf '%s\n' "$changed" | grep -q '^plugins/' && ! printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "Add a line under ## Unreleased in CHANGELOG.md, or label the pull request no-changelog" >&2
            exit 1
          fi
